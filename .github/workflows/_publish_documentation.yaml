name: Publish documentation

on:
  workflow_call:
  workflow_dispatch:

env:
  UV_NO_SYNC: 1
  UV_VERSION: 0.12.7

jobs:
  publish-documentation:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Allow mkdocs to push to gh-pages branch
    env:
      UV_NO_SYNC: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Python packages
        run: uv sync --locked
        shell: bash

      - name: Publish documentation
        run: uv run -- mkdocs gh-deploy --config-file docs/mkdocs.yml --remote-branch gh-pages --clean --force --strict
